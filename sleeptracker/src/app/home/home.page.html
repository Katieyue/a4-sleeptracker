<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <img
        src="assets/crescent-moon.png"
        alt="moon image"
        style="height: 60px; vertical-align: middle"
      />
      Sleep Tracker App
    </ion-title>
  </ion-toolbar>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Dongle:wght@300;400;700&family=Nerko+One&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet"
  />
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense"> </ion-header>
  <h1 class="welcome" style="font-size: 45px">Welcome back!</h1>
  <p class="welcome">View or add to your log</p>

  <ion-button class="add-entry" expand="block" (click)="setOpen(true)"
    >Add entry</ion-button
  >
  <ion-modal [isOpen]="isModalOpen">
    <ng-template>
      <p>Log your sleep!</p>
      <p>Time you went to bed:</p>
      <app-date-time-picker [(date)]="bedtime"></app-date-time-picker>
      <p>Time you woke up:</p>
      <app-date-time-picker [(date)]="waketime"></app-date-time-picker>

      <ion-buttons slot="end">
        <ion-button class="save" (click)="saveEntry()">Save</ion-button>
      </ion-buttons>
    </ng-template>
  </ion-modal>

  <ion-list>
    @for (data of overnightSleepData; track data) {
    <ion-card>
      <ion-card-header>
        <!-- <ion-card-subtitle>blah</ion-card-subtitle> -->
        <ion-card-title>{{data.dateString()}}</ion-card-title>
      </ion-card-header>
      <ion-card-content>{{data.summaryString()}}</ion-card-content>
    </ion-card>
    }
  </ion-list>

  <div id="container"></div>
</ion-content>
